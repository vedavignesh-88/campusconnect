services:
  - type: web
    name: campusconnect-backend
    env: java
    plan: free
    rootDir: CampusConnect/backend
    buildCommand: mvn clean package -DskipTests
    startCommand: java -jar target/campusconnect-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: MONGODB_URI
        sync: false
